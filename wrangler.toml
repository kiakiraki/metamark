name = "metamark"
compatibility_date = "2025-08-31"
workers_dev = false
preview_urls = true

# Static-assets-only Worker: all response headers (security + caching,
# including the CSP) come from dist/_headers, which Vite copies verbatim
# from public/_headers during the build. scripts/verify-csp.mjs (the
# postbuild hook) only verifies the copied CSP; it does not generate it.
[assets]
directory = "dist"
not_found_handling = "single-page-application"

[[routes]]
pattern = "metamark.kiakiraki.dev"
custom_domain = true

[env.preview]
name = "metamark-preview"
workers_dev = true
# Do not inherit the production custom domain — deploying preview would
# otherwise reassign metamark.kiakiraki.dev away from the production Worker.
routes = []
